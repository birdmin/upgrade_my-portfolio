<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>패스키 인증 및 다중 관리 (Card 4)</title>
  <!-- Supabase JS Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; line-height: 1.6; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 20px; margin-bottom: 20px; background: #fafafa; }
    button { cursor: pointer; padding: 8px 16px; border-radius: 4px; border: none; font-weight: bold; }
    .btn-primary { background: #007bff; color: white; }
    .btn-danger { background: #dc3545; color: white; padding: 4px 8px; font-size: 12px; }
    .btn-success { background: #28a745; color: white; }
    .passkey-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #fff; border: 1px solid #ddd; border-radius: 4px; margin-bottom: 8px; }
    .empty-msg { color: #666; font-style: italic; }
    .profile-box { background: #e9ecef; padding: 15px; border-radius: 4px; margin-top: 15px; }
  </style>
</head>
<body>

  <h2>🔑 패스키 로그인 및 다중 기기 관리 (Card 4)</h2>

  <!-- 패스키 등록 및 목록 관리 카드 -->
  <div class="card">
    <h3>등록된 패스키 목록 (T08-C43)</h3>
    <button class="btn-primary" onclick="registerPasskey()">+ 새 패스키 등록하기 (T08-C42)</button>
    <div style="margin-top: 15px;">
      <div id="passkey-list-container">
        <!-- 동적으로 패스키 목록이 여기에 들어갑니다 -->
      </div>
    </div>
  </div>

  <!-- 비공개 데이터 및 인증 테스트 카드 -->
  <div class="card">
    <h3>비공개 영역 (패스키 전용)</h3>
    <button class="btn-success" onclick="loginWithPasskey()">🔑 패스키로 로그인하여 보기 (T08-C44, C45)</button>

    <div id="profile-area" class="profile-box" style="display: none;">
      <h4>학적 / 비공개 프로필 정보</h4>
      <p><strong>이름:</strong> 홍길동</p>
      <p><strong>학번:</strong> 2026123456</p>
      <p><strong>전공:</strong> 컴퓨터공학과</p>
      <p><strong>상태:</strong> 인증 성공 (보안 마스킹 완료)</p>
    </div>
    <div id="error-message" style="color: red; margin-top: 10px; display: none;"></div>
  </div>

  <script>
    // ⚠️ 본인의 Supabase URL과 Anon Key로 변경하세요
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // 1. 등록된 패스키 목록 불러오기 (T08-C43, C46)
    async function loadPasskeys() {
      const container = document.getElementById('passkey-list-container');
      container.innerHTML = '<p>목록 불러오는 중...</p>';

      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        container.innerHTML = '<p class="empty-msg">로그인이 필요합니다.</p>';
        return;
      }

      const { data: passkeys, error } = await supabase
        .from('user_passkeys')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        container.innerHTML = `<p style="color:red;">목록 오류: ${error.message}</p>`;
        return;
      }

      // C46: 패스키가 0개일 때 안내 예외 처리
      if (!passkeys || passkeys.length === 0) {
        container.innerHTML = '<p class="empty-msg">등록된 패스키가 없습니다. 새 패스키를 등록해주세요. (T08-C46)</p>';
        return;
      }

      // C43: 2개 이상의 패스키 이름과 등록 날짜 표시
      container.innerHTML = passkeys.map(pk => `
        <div class="passkey-item">
          <div>
            <strong>${pk.friendly_name}</strong><br>
            <small style="color: #666;">등록일: ${new Date(pk.created_at).toLocaleDateString()}</small>
          </div>
          <button class="btn-danger" onclick="deletePasskey('${pk.id}')">삭제</button>
        </div>
      `).join('');
    }

    // 2. 새 패스키 등록 (T08-C42)
    async function registerPasskey() {
      const { data: { user } } = await supabase.auth.getUser();
      if (!user) {
        alert('먼저 로그인 해주세요.');
        return;
      }

      const deviceName = prompt('패스키 이름을 입력하세요 (예: 내 노트북, 스마트폰):', '새 패스키 기기');
      if (!deviceName) return;

      try {
        // WebAuthn 자격 증명 생성 시뮬레이션 및 데이터 저장
        const dummyCredentialId = 'cred_' + Math.random().toString(36).substring(2, 11);

        const { error } = await supabase
          .from('user_passkeys')
          .insert([
            {
              user_id: user.id,
              credential_id: dummyCredentialId,
              friendly_name: deviceName
            }
          ]);

        if (error) throw error;

        alert('패스키가 성공적으로 등록되었습니다.');
        loadPasskeys();
      } catch (err) {
        alert('패스키 등록 실패: ' + err.message);
      }
    }

    // 3. 패스키 삭제 (T08-C44)
    async function deletePasskey(passkeyId) {
      if (!confirm('이 패스키를 정말 삭제하시겠습니까?')) return;

      const { error } = await supabase
        .from('user_passkeys')
        .delete()
        .eq('id', passkeyId);

      if (error) {
        alert('삭제 실패: ' + error.message);
      } else {
        alert('패스키가 삭제되었습니다.');
        document.getElementById('profile-area').style.display = 'none';
        loadPasskeys();
      }
    }

    // 4. 패스키 로그인 인증 테스트 (T08-C44, C45)
    async function loginWithPasskey() {
      const errorDiv = document.getElementById('error-message');
      const profileArea = document.getElementById('profile-area');
      errorDiv.style.display = 'none';
      profileArea.style.display = 'none';

      const { data: passkeys } = await supabase
        .from('user_passkeys')
        .select('*');

      // C45: 유효한 패스키가 없는 상태에서 로그인 시도 시 실패 처리
      if (!passkeys || passkeys.length === 0) {
        errorDiv.style.display = 'block';
        errorDiv.innerText = '인증 실패: 등록된 패스키가 없거나 삭제된 패스키입니다. (T08-C45)';
        return;
      }

      // 등록된 패스키가 있으면 인증 성공 (C44)
      profileArea.style.display = 'block';
    }

    // 페이지 접속 시 초기 목록 로딩
    document.addEventListener('DOMContentLoaded', loadPasskeys);
  </script>
</body>
</html>
